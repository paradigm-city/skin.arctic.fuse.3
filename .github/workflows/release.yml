name: Release

# Start from the Actions tab: Release > Run workflow, then pick the branch.
# Reads id and version from addon.xml, runs the skin checks, builds the zip and publishes
# a GitHub release tagged <id>-<version>. Bump the version in addon.xml first: the run
# stops if that tag already exists. Releases from a branch other than the default branch
# are marked as pre-releases.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install polib
      - run: python .github/scripts/check_skin.py
      - id: build
        run: python .github/scripts/build_zip.py dist
      - name: Stop if this version was already released
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Bump the version in addon.xml, commit, and run again."
            exit 1
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
          ZIP: ${{ steps.build.outputs.zip }}
          TITLE: ${{ steps.build.outputs.name }} ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ github.ref_name != github.event.repository.default_branch }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes "${flags[@]}"
