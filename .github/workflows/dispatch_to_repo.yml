name: Dispatch to Repo
on: 
  push:
    tags:
      - "*"
  workflow_dispatch:
    
jobs:
  dispatch:
    # Upstream's release hook. Only runs in jurialmunkey's repository, not in forks.
    if: github.repository == 'jurialmunkey/skin.arctic.fuse.3'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: ["jurialmunkey/repository.jurialmunkey"]
    steps:
      - name: Push to repo
        uses: peter-evans/repository-dispatch@v1
        with:
          token: ${{ secrets.TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: update
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "module": "jurialmunkey/skin.arctic.fuse.3", "tag": "${{ github.ref_name }}"}'
