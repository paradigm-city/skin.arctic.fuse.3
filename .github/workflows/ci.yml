name: CI

# Runs on every push and pull request.
#   checks         - blocking: XML/JSON/PO validity, addon.xml, undefined $VAR/$EXP/includes
#   package        - builds the installable zip and keeps it as a downloadable artifact
#   addon-checker  - advisory: Kodi's official kodi-addon-checker. It enforces official-repository
#                    rules this skin cannot meet (dependencies outside the Kodi repo, artwork sizes),
#                    so its result never fails the workflow. Read its report in the job summary.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KODI_BRANCH: omega

jobs:
  checks:
    name: Skin checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install polib
      - run: python .github/scripts/check_skin.py

  package:
    name: Build zip
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: build
        run: python .github/scripts/build_zip.py dist
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.tag }}-${{ github.sha }}
          path: dist/*.zip
          retention-days: 14

  addon-checker:
    name: Kodi add-on checker (advisory)
    needs: checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install kodi-addon-checker
      - id: build
        run: python .github/scripts/build_zip.py dist
      - name: Run kodi-addon-checker
        env:
          ADDON_ID: ${{ steps.build.outputs.id }}
        run: |
          mkdir -p check
          unzip -q dist/*.zip -d check
          cd check
          status=0
          kodi-addon-checker --branch "$KODI_BRANCH" "$ADDON_ID" > ../addon-checker.txt 2>&1 || status=$?
          cd ..
          sed -i 's/\x1b\[[0-9;]*m//g' addon-checker.txt
          {
            echo "## kodi-addon-checker ($KODI_BRANCH)"
            echo
            echo "Advisory only. Exit code: $status"
            echo
            echo '| Count | Finding |'
            echo '| ---: | --- |'
            grep -E '^\s*(ERROR|WARN):' addon-checker.txt \
              | sed -E 's/^\s*//; s/(corrupted \?).*/\1 <file>/; s/(non whitelisted file ending in filename).*/\1 <file>/; s/\|/\\|/g' \
              | sort | uniq -c | sort -rn \
              | awk '{c=$1; $1=""; sub(/^ /,""); print "| " c " | " $0 " |"}'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: addon-checker-report-${{ github.sha }}
          path: addon-checker.txt
          retention-days: 14
